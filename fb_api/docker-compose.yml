# docker-compose.yml — Tổng hợp toàn bộ hệ thống
# Đặt tại: fb_api/docker-compose.yml
#
# Bao gồm:
#   - kafka (KRaft mode)
#   - kafka-ui
#   - webhook-service (Node.js, nhận event từ Facebook)
#   - core-service    (Node.js, consumer + spam + AI + decision)
#
# Cách chạy:
#   docker-compose up -d
#   docker-compose logs -f core-service

services:
  # ─── Kafka (KRaft mode, không cần Zookeeper) ──────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Kafka UI (xem topic, message) ────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # ─── Webhook Service (nhận event từ Facebook → publish Kafka) ─────────────
  webhook-service:
    build:
      context: ./services/webhook-service
      dockerfile: Dockerfile
    container_name: webhook-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      VERIFY_TOKEN: ${VERIFY_TOKEN:-123456}
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-raw_events}
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ─── Core Service (consume Kafka → spam + AI + decision) ──────────────────
  core-service:
    build:
      context: ./services/core-service
      dockerfile: Dockerfile
    container_name: core-service
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-raw_events}
      KAFKA_GROUP_ID: core-service-group
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN}
      FACEBOOK_GRAPH_URL: ${FACEBOOK_GRAPH_URL:-https://graph.facebook.com/v25.0}
      SPAM_REPEAT_THRESHOLD: ${SPAM_REPEAT_THRESHOLD:-3}
      SPAM_WINDOW_HOURS: ${SPAM_WINDOW_HOURS:-24}
      RECIDIVISM_THRESHOLD: ${RECIDIVISM_THRESHOLD:-5}
    volumes:
      # Giữ blacklist và review_queue tồn tại khi restart container
      - core-service-data:/app/data
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ─── Retry Service (consume Kafka → Facebook Graph API retries) ───────────
  retry-service:
    build:
      context: ./services/retry-service
      dockerfile: Dockerfile
    container_name: retry-service
    environment:
      KAFKA_BROKER: kafka:29092
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN}
      FACEBOOK_GRAPH_URL: ${FACEBOOK_GRAPH_URL:-https://graph.facebook.com/v25.0}
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ─── Backend API (consume Kafka → reply to Facebook comments) ─────────────
  backend-api:
    build:
      context: ./services/backend-api
      dockerfile: Dockerfile
    container_name: backend-api
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC_REPLY: reply_commands
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN}
      FACEBOOK_GRAPH_URL: ${FACEBOOK_GRAPH_URL:-https://graph.facebook.com/v25.0}
    volumes:
      - backend-api-data:/app/data
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  core-service-data:
  backend-api-data:
